version: 2
# Merge-Reihenfolge: .github/workflows/dependabot-queue.yml (ein PR nach dem anderen, auch Majors).
# CI: .github/workflows/dependabot-ci-automerge.yml bei package.json- / Workflow-Änderungen.
# package-lock.json ist gitignored — Workflows nutzen npm install.
# Optional: Secret QUEUE_GITHUB_TOKEN (PAT) falls CODEOWNERS/Rulesets den Merge blockieren.
# Repo-Einstellung „Allow auto-merge“ ist hilfreich, die Queue merged aber direkt per gh.
updates:
  # npm Dependencies überwachen
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    reviewers:
      - 'MaximHarder'
    assignees:
      - 'MaximHarder'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'security'
      - 'automated'
    # TypeScript 7 (native) bricht typescript-eslint / vue-tsc — Major ignorieren bis Tooling bereit.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # GitHub Actions überwachen
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'semiannually'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 3
    reviewers:
      - 'MaximHarder'
    assignees:
      - 'MaximHarder'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'automated'
