name: CI and Dependabot Automerge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'package.json'
      - '.github/workflows/**'
  push:
    branches: [main, master]
    paths:
      - 'package.json'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: Install and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        # package-lock.json ist gitignored; npm ci braucht eine committed Lockfile
        run: npm install || npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build:client
