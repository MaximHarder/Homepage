name: FTP Deployment

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch: # Manueller Start möglich

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: keys
    # Zusätzlich zur Wait-Step: serialisiert gegen Dependabot CI/Automerge
    concurrency:
      group: dependabot-updates-gate
      cancel-in-progress: false

    steps:
      - name: Auf Security Audit und Dependabot warten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TIMEOUT=3600
          INTERVAL=30
          elapsed=0

          # Parallele Workflows (gleicher Push) brauchen kurz Zeit zum Registrieren
          echo "Kurz warten, damit parallele Workflows starten können..."
          sleep 20

          wait_open_runs() {
            local workflow="$1"
            local filter_sha="${2:-}"
            local desc="$3"
            while true; do
              local jq_filter
              if [ -n "$filter_sha" ]; then
                jq_filter="[.[] | select(.headSha == \"${filter_sha}\") | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"pending\" or .status == \"waiting\")] | length"
              else
                jq_filter='[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting")] | length'
              fi
              local count
              count=$(gh run list --repo "$REPO" --workflow "$workflow" --limit 20 --json databaseId,status,headSha --jq "$jq_filter")
              if [ "$count" = "0" ]; then
                echo "${desc}: keine offenen Runs"
                break
              fi
              if [ "$elapsed" -ge "$TIMEOUT" ]; then
                echo "Timeout beim Warten auf ${desc}"
                exit 1
              fi
              echo "${desc}: ${count} offene Run(s) — warte ${INTERVAL}s..."
              sleep "$INTERVAL"
              elapsed=$((elapsed + INTERVAL))
            done
          }

          # Security Audit für diesen Commit (startet oft parallel zum Deploy)
          wait_open_runs "security-audit.yml" "$SHA" "Security Audit"
          # Laufende Dependabot-CI/Automerge-PRs im Repo
          wait_open_runs "dependabot-ci-automerge.yml" "" "Dependabot CI/Automerge"
          echo "Alle Gates frei — Deploy fortsetzen"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        # package-lock.json ist gitignored; npm ci braucht eine committed Lockfile
        run: npm install

      - name: Build project
        run: npm run build:client
        env:
          VITE_CF_TURNSTILE_SITEKEY: ${{ secrets.VITE_CF_TURNSTILE_SITEKEY }}

      - name: List build files
        run: ls -la dist/

      - name: Create .env file for FTP
        run: |
          echo "VITE_CF_TURNSTILE_SITEKEY=${{ secrets.VITE_CF_TURNSTILE_SITEKEY }}" > dist/.env
          echo "Created .env file with Turnstile sitekey"

      # Nach fehlgeschlagenem clean-slate kann der Sync-State assets/* listen,
      # obwohl assets/ fehlt. FTP-Deploy schreibt dann in ein fehlendes Verzeichnis → 553.
      # assets/ neu anlegen und veralteten Sync-State löschen, damit der nächste Sync
      # Ordner korrekt anlegt.
      - name: Prepare FTP remote dirs
        env:
          FTP_SERVER: ${{ secrets.FTP_IP }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          python3 <<'PY'
          import os
          from ftplib import FTP, error_perm

          host = os.environ["FTP_SERVER"]
          port = int(os.environ.get("FTP_PORT") or "21")
          ftp = FTP()
          ftp.connect(host, port, timeout=60)
          ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASSWORD"])

          def dir_exists(name: str) -> bool:
              try:
                  ftp.cwd(name)
                  ftp.cwd("..")
                  return True
              except error_perm:
                  return False

          if dir_exists("assets"):
              print("assets/ existiert bereits")
          else:
              print("assets/ fehlt — Ordner anlegen und veralteten Sync-State löschen")
              try:
                  ftp.mkd("assets")
                  print("assets/ angelegt")
              except error_perm as err:
                  raise SystemExit(f"assets/ konnte nicht angelegt werden: {err}") from err
              try:
                  ftp.delete(".ftp-deploy-sync-state.json")
                  print(".ftp-deploy-sync-state.json gelöscht")
              except error_perm as err:
                  print(f"Sync-State nicht entfernt (ok falls nicht vorhanden): {err}")

          ftp.quit()
          PY

      - name: Deploy to FTP
        # v4.4.0 nutzt Node 24 (vermeidet Node-20-Deprecation).
        # Kein dangerous-clean-slate: nach komplettem Wipe liefern viele FTP-Hosts
        # 550, wenn assets/ angelegt und sofort per CWD betreten wird.
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_IP }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: ${{ secrets.FTP_PORT }}
          server-dir: ./
          local-dir: ./dist/
          exclude: |
            **/.php-ini
            **/.php-version
            **/README.md

      - name: Send success notification
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHANNEL }}
          token: ${{ secrets.TG_BOT }}
          format: markdown
          message: |
            ✅ *Deployment erfolgreich - maxim-harder.de*

            Das Deployment auf maxim-harder.de war **erfolgreich**!

            📅 **Datum**: ${{ github.event.head_commit.timestamp }}
            🔄 **Commit**: `${{ github.sha }}`
            📝 **Nachricht**: ${{ github.event.head_commit.message }}
            👤 **Autor**: [${{ github.event.head_commit.author.name }}](https://github.com/${{ github.event.head_commit.author.username }})

            Alle Dateien wurden erfolgreich auf den FTP-Server hochgeladen.

            🚀 [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        continue-on-error: true

      - name: Send failure notification
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHANNEL }}
          token: ${{ secrets.TG_BOT }}
          format: markdown
          message: |
            ❌ *Deployment fehlgeschlagen - maxim-harder.de*

            Das Deployment auf maxim-harder.de ist **fehlgeschlagen**!

            📅 **Datum**: ${{ github.event.head_commit.timestamp }}
            🔄 **Commit**: `${{ github.sha }}`
            📝 **Nachricht**: ${{ github.event.head_commit.message }}
            👤 **Autor**: [${{ github.event.head_commit.author.name }}](https://github.com/${{ github.event.head_commit.author.username }})

            Bitte überprüfe die GitHub Actions Logs für weitere Details.

            🔍 [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        continue-on-error: true
