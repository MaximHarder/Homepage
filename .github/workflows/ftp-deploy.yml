name: FTP Deployment

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch: # Manueller Start möglich

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  check-dependabot:
    name: Check if Dependabot
    runs-on: ubuntu-latest
    outputs:
      is-dependabot: ${{ steps.check.outputs.is-dependabot }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Check if triggered by Dependabot
        id: check
        run: |
          # Bei manuellem Start (workflow_dispatch) immer erlauben
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is-dependabot=false" >> $GITHUB_OUTPUT
            echo "Manual workflow dispatch - allowing deployment"
            exit 0
          fi

          ACTOR="${{ github.actor }}"
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          REF="${{ github.ref }}"

          # Prüfe ob es ein Release-Branch ist (releases/v*)
          if [[ "$REF" =~ ^refs/heads/releases/v ]] || [[ "$REF" =~ ^refs/remotes/origin/releases/v ]]; then
            echo "is-dependabot=false" >> $GITHUB_OUTPUT
            echo "Release branch detected - allowing deployment"
            exit 0
          fi

          # Prüfe nur den aktuellen Commit, nicht die Historie
          # Prüfe auf Dependabot-Actor oder Commit-Autor
          # Nur prüfen wenn es wirklich Dependabot ist, nicht nur wegen Commit-Message
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "is-dependabot=true" >> $GITHUB_OUTPUT
            echo "Skipping deployment - triggered by Dependabot"
            echo "Actor: $ACTOR"
            exit 0
          fi

          # Prüfe Commit-Autor nur wenn es wirklich Dependabot ist
          if echo "$COMMIT_AUTHOR" | grep -qi "^dependabot\[bot\]$"; then
            echo "is-dependabot=true" >> $GITHUB_OUTPUT
            echo "Skipping deployment - commit author is Dependabot"
            echo "Commit Author: $COMMIT_AUTHOR"
            exit 0
          fi

          # Prüfe nur ob der aktuelle Commit direkt von Dependabot stammt
          # Prüfe nur auf explizite Dependabot-Referenzen im aktuellen Commit
          if echo "$COMMIT_MSG" | grep -qiE "^Merge.*dependabot/|^Bump.*from.*dependabot/|dependabot\[bot\]"; then
            echo "is-dependabot=true" >> $GITHUB_OUTPUT
            echo "Skipping deployment - commit message indicates Dependabot"
            echo "Commit Message: $COMMIT_MSG"
            exit 0
          fi

          # Kein Dependabot erkannt
          echo "is-dependabot=false" >> $GITHUB_OUTPUT
          echo "Not triggered by Dependabot, proceeding with deployment"
          echo "Actor: $ACTOR"
          echo "Commit Author: $COMMIT_AUTHOR"
          echo "Ref: $REF"

  build-and-deploy:
    name: Build and Deploy
    needs: check-dependabot
    if: needs.check-dependabot.outputs.is-dependabot == 'false'
    runs-on: ubuntu-latest
    environment: keys
    # Wartet, bis Dependabot CI/Automerge fertig ist — danach wird deployed
    # (auch nach Dependabot-Merges auf main; kein Skip)
    concurrency:
      group: dependabot-updates-gate
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build:client
        env:
          VITE_CF_TURNSTILE_SITEKEY: ${{ secrets.VITE_CF_TURNSTILE_SITEKEY }}

      - name: List build files
        run: ls -la dist/

      - name: Create .env file for FTP
        run: |
          echo "VITE_CF_TURNSTILE_SITEKEY=${{ secrets.VITE_CF_TURNSTILE_SITEKEY }}" > dist/.env
          echo "Created .env file with Turnstile sitekey"

      # Nach fehlgeschlagenem clean-slate kann der Sync-State assets/* listen,
      # obwohl assets/ fehlt. FTP-Deploy schreibt dann in ein fehlendes Verzeichnis → 553.
      # assets/ neu anlegen und veralteten Sync-State löschen, damit der nächste Sync
      # Ordner korrekt anlegt.
      - name: Prepare FTP remote dirs
        env:
          FTP_SERVER: ${{ secrets.FTP_IP }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          python3 <<'PY'
          import os
          from ftplib import FTP, error_perm

          host = os.environ["FTP_SERVER"]
          port = int(os.environ.get("FTP_PORT") or "21")
          ftp = FTP()
          ftp.connect(host, port, timeout=60)
          ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASSWORD"])

          def dir_exists(name: str) -> bool:
              try:
                  ftp.cwd(name)
                  ftp.cwd("..")
                  return True
              except error_perm:
                  return False

          if dir_exists("assets"):
              print("assets/ existiert bereits")
          else:
              print("assets/ fehlt — Ordner anlegen und veralteten Sync-State löschen")
              try:
                  ftp.mkd("assets")
                  print("assets/ angelegt")
              except error_perm as err:
                  raise SystemExit(f"assets/ konnte nicht angelegt werden: {err}") from err
              try:
                  ftp.delete(".ftp-deploy-sync-state.json")
                  print(".ftp-deploy-sync-state.json gelöscht")
              except error_perm as err:
                  print(f"Sync-State nicht entfernt (ok falls nicht vorhanden): {err}")

          ftp.quit()
          PY

      - name: Deploy to FTP
        # v4.4.0 nutzt Node 24 (vermeidet Node-20-Deprecation).
        # Kein dangerous-clean-slate: nach komplettem Wipe liefern viele FTP-Hosts
        # 550, wenn assets/ angelegt und sofort per CWD betreten wird.
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_IP }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: ${{ secrets.FTP_PORT }}
          server-dir: ./
          local-dir: ./dist/
          exclude: |
            **/.php-ini
            **/.php-version
            **/README.md

      - name: Send success notification
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHANNEL }}
          token: ${{ secrets.TG_BOT }}
          format: markdown
          message: |
            ✅ *Deployment erfolgreich - maxim-harder.de*

            Das Deployment auf maxim-harder.de war **erfolgreich**!

            📅 **Datum**: ${{ github.event.head_commit.timestamp }}
            🔄 **Commit**: `${{ github.sha }}`
            📝 **Nachricht**: ${{ github.event.head_commit.message }}
            👤 **Autor**: [${{ github.event.head_commit.author.name }}](https://github.com/${{ github.event.head_commit.author.username }})

            Alle Dateien wurden erfolgreich auf den FTP-Server hochgeladen.

            🚀 [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        continue-on-error: true

      - name: Send failure notification
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHANNEL }}
          token: ${{ secrets.TG_BOT }}
          format: markdown
          message: |
            ❌ *Deployment fehlgeschlagen - maxim-harder.de*

            Das Deployment auf maxim-harder.de ist **fehlgeschlagen**!

            📅 **Datum**: ${{ github.event.head_commit.timestamp }}
            🔄 **Commit**: `${{ github.sha }}`
            📝 **Nachricht**: ${{ github.event.head_commit.message }}
            👤 **Autor**: [${{ github.event.head_commit.author.name }}](https://github.com/${{ github.event.head_commit.author.username }})

            Bitte überprüfe die GitHub Actions Logs für weitere Details.

            🔍 [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        continue-on-error: true
